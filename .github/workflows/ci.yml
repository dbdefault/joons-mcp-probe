name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node scripts/test.js
        env:
          PROBE_TEST_REPORT: test-results.xml
      - name: Smoke test
        shell: bash
        run: |
          node bin/joons-mcp-probe.js --version
          node bin/joons-mcp-probe.js stdio --format json --json-out probe-report.json -- node examples/stdio-server.js
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            test-results.xml
            probe-report.json
